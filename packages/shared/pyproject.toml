[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shared"
version = "0.1.0"
description = "Shared Python package for models, config, utils, exceptions, and logging"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="atang", email="you@example.com" }
]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0.0",
  "pillow>=10.0.0",
  "openai>=1.0.0",
  "tenacity>=8.0.0",
  "loguru>=0.7.0",
]

[tool.setuptools]
py-modules = ["config", "exceptions", "logger"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "shared",
  "shared.*",
  "models",
  "models.*",
  "utils",
  "utils.*",
]

