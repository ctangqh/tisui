[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "server"
version = "0.1.0"
description = "Tisui playground backend service"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "atang", email = "you@example.com" }
]
dependencies = [
  "tisui>=0.1.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0.0",
  "Pillow>=10.0.0",
  "tenacity>=8.0.0",
  "openai>=1.0.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[project.scripts]
tisui-server = "server.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
