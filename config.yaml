# =============================================================================
# Tisui 配置文件（全量示例）
# =============================================================================
# 放在项目根目录或运行目录，SDK 会自动加载。
# 未配置的项一律取默认值（见每项后的括号）。
#
# 配置文件查找优先级：
#   1. 环境变量 TISUI_CONFIG_PATH 指向的路径
#   2. 开发态工作区根目录 / config.yaml
#   3. 当前工作目录 / config.yaml
#   4. 包安装目录 / config.yaml
#   5. 包内兜底模板 packages/shared/src/tisui/shared/env/config.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 模型配置（必填，SDK 核心依赖）
# -----------------------------------------------------------------------------
model:
  # ===== 语言模型：ai_act 规划、结构化问答、位置推断 =====
  llm:
    provider: openai                                    # doubao / deepseek / openai（任意 OpenAI 兼容端点）
    base_url: https://api.openai.com/v1                 # 服务端点
    model: gpt-4o                                       # 模型名
    temperature: 0.0                                    # 采样温度，0 = 确定性最高（可选，不填则不传该参数）
    max_tokens: 1500                                    # 单次最大输出 token（可选，不填由服务端决定）
    timeout: 60                                         # 单次请求超时秒数（可选，回退到 model.timeout）
    max_retries: 3                                      # 失败重试次数（可选，回退到 model.max_retries）

  # ===== 视觉模型：截图定位，核心能力 =====
  # 未配置的字段自动继承 llm 的值；只有需要「文本走便宜模型、视觉走强模型」时才单独写
  vision:
    provider: openai                                    # 不填 = 继承 llm.provider
    base_url: https://api.openai.com/v1                 # 不填 = 继承 llm.base_url
    model: gpt-4o                                       # 不填 = 继承 llm.model
    temperature: 0.0                                    # 不填 = 继承 llm.temperature
    max_tokens: 6000                                    # 视觉输出通常更长，建议单独调大
    timeout: 60                                         # 不填 = 继承 model.timeout
    max_retries: 3                                      # 不填 = 继承 model.max_retries

  # ===== 全局兜底（llm / vision 都没写 timeout、max_retries 时生效）=====
  timeout: 60                                           # 默认 60
  max_retries: 3                                        # 默认 3

# -----------------------------------------------------------------------------
# ai_act 行为（一句话多步编排）
# -----------------------------------------------------------------------------
act:
  cycle_limit: 5                     # 最大重规划轮次，默认 5；调用时显式传参可覆盖
  total_timeout: 900                 # 单任务墙钟上限（秒），默认 900

# -----------------------------------------------------------------------------
# ai_explore 行为（自主探索）
# -----------------------------------------------------------------------------
explore:
  max_cycles: 50                     # 最大探索轮次，默认 50；调用时 max_cycles 参数可覆盖
  total_timeout: 600                 # 探索墙钟上限（秒），默认 600
  max_depth: null                    # 最大页面跳转深度，默认 null（不限制）；depth-first 策略下常用

  # 危险词拦截开关
  #   true  (默认) = 启用内置黑名单（28 个词：删除/清空/支付/购买/退出登录/uninstall/logout 等）
  #                  + 调用时传入的 forbidden 合并生效，命中即拦截并记 anomaly
  #   false        = 关闭内置黑名单；调用时显式传入的 forbidden 仍然生效
  #   配置缺失或类型非 bool 时回退到 true（向后兼容）
  forbidden_enabled: true

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level: INFO                        # DEBUG / INFO / WARNING / ERROR，默认 INFO
  file_path: logs/tisui.log          # 日志文件路径，相对路径以配置文件所在目录为基准

# -----------------------------------------------------------------------------
# 运行时环境
# -----------------------------------------------------------------------------
runtime:
  env: dev                           # dev / prod，默认按是否存在 packages/ 目录自动判断
                                     # 也可用环境变量 TISUI_ENV 覆盖
  debug: false                       # 调试模式，默认 false；开启后输出更详细的执行轨迹
  workspace_root: .                  # 工作区根目录，相对路径以配置文件所在目录为基准
  core_package_root: packages/core   # core 包位置（dev 态用 packages/core，prod 态用 .）
  cache_path: .cache                 # 缓存目录，默认 <cwd>/.cache
  report_path: output/reports        # 测试报告输出目录，默认 <workspace>/output/reports
  env_files:                         # .env 文件列表（按顺序加载，后面的覆盖前面的）
    - .env

# -----------------------------------------------------------------------------
# Prompt 本地化
# -----------------------------------------------------------------------------
prompt:
  default_locale: zh-CN              # 默认提示词语言，默认 zh-CN
  locale_fallbacks:                  # 语言回退链
    zh: zh-CN
    en: en-US

# -----------------------------------------------------------------------------
# 兼容字段（旧版配置，建议迁移到 runtime.env）
# -----------------------------------------------------------------------------
# environment: dev                   # 等价于 runtime.env，仅在没有 runtime.env 时生效
